name: VSIX recette

# Recette d'installation du VSIX candidat sur Linux, Windows et macOS Apple
# Silicon : installation fraîche, consentement et installation des dépendances
# Python, échec hors ligne (index pip injoignable), mise à jour depuis la
# version publiée. Aucune publication, aucun secret.
on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Version donnée au VSIX de recette (jamais publiée)
        default: '0.3.3'
      previous_version:
        description: Version publiée à mettre à jour
        default: '0.3.2'
  push:
    branches:
      - 'recette/**'

permissions:
  contents: read

concurrency:
  group: vsix-recette-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recette:
    name: Recette ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CANDIDATE_VERSION: ${{ inputs.candidate_version || '0.3.3' }}
      PREVIOUS_VERSION: ${{ inputs.previous_version || '0.3.2' }}
    defaults:
      run:
        shell: bash
        working-directory: extension

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Setup Python (minimum supporté 3.10)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: npm ci

      - name: Package candidate VSIX (official profile, recette version)
        run: |
          npm version "$CANDIDATE_VERSION" --no-git-tag-version --allow-same-version
          npm run profile:prepare:official
          npx vsce package --out "$RUNNER_TEMP/pof-candidate.vsix"

      - name: Run recette (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libsecret-1-0 libxkbfile1
          xvfb-run -a node scripts/recette/run-vsix-recette.js \
            --vsix "$RUNNER_TEMP/pof-candidate.vsix" --out "$RUNNER_TEMP/recette" --previous "$PREVIOUS_VERSION"

      - name: Run recette (Windows, macOS)
        if: runner.os != 'Linux'
        run: |
          node scripts/recette/run-vsix-recette.js \
            --vsix "$RUNNER_TEMP/pof-candidate.vsix" --out "$RUNNER_TEMP/recette" --previous "$PREVIOUS_VERSION"

      - name: Upload recette report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vsix-recette-${{ matrix.os }}
          path: ${{ runner.temp }}/recette/
          if-no-files-found: warn
