name: Large Real Corpus Loadtest

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  large-real-corpus:
    name: Large corpus (${{ matrix.arch }})
    # gcc-mips-linux-gnu n'existe pas sur Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            toolchain: build-essential binutils
          - arch: arm64
            toolchain: gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          - arch: mips32
            toolchain: gcc-mips-linux-gnu binutils-mips-linux-gnu
          - arch: ppc32
            toolchain: gcc-powerpc-linux-gnu binutils-powerpc-linux-gnu
          - arch: riscv64
            toolchain: gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install native and cross toolchains
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.toolchain }}
          pip install -r extension/backends/requirements-ci.txt

      - name: Build 100 MiB compiled corpus
        run: >-
          python3 -m tooling.loadtest.real_corpus
          --arch "${{ matrix.arch }}"
          --size-mib 100
          --output "${{ runner.temp }}/corpus-${{ matrix.arch }}.elf"

      - name: Enforce guarded large budgets
        run: >-
          python3 -m tooling.loadtest
          --binary "${{ runner.temp }}/corpus-${{ matrix.arch }}.elf"
          --size large
          --memory-limit-mib 1536
          --timeout-cap-s 60
          --results-dir "${{ runner.temp }}/large-real-corpus-results"

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: large-real-corpus-${{ matrix.arch }}
          path: ${{ runner.temp }}/large-real-corpus-results/loadtest_*.json
          if-no-files-found: error
